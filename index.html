<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Projeto</title>
    <link rel="manifest" href="manifest.json"> <!-- Link para o manifesto -->
    <link rel="stylesheet" href="assets/styles/layout.css">
    <link rel="stylesheet" href="assets/styles/colors.css">
    <script src="src/App.js" defer></script> <!-- Incluindo o script das funções -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"> <!-- Font Awesome para ícones -->
</head>
<body>
    <div id="app-container">
        <nav>
            <button onclick="showLogin()">Login</button>
            <button onclick="showRegister()">Registrar</button>
        </nav>

        <div id="login-container" style="display: none;">
            <h2>Login</h2>
            <input type="email" id="loginEmail" placeholder="Email" required>
            <input type="password" id="loginPassword" placeholder="Senha" required>
            <button onclick="loginUser()">Entrar</button>
        </div>

        <div id="register-container" style="display: none;">
            <h2>Registrar</h2>
            <input type="email" id="registerEmail" placeholder="Email" required>
            <input type="password" id="registerPassword" placeholder="Senha" required>
            <button onclick="registerUser()">Registrar</button>
        </div>

        <div id="editor-container" style="display: none;">
            <h2>Editor de Código</h2>
            <textarea placeholder="Escreva seu código HTML aqui..."></textarea>
        </div>
        <div id="chat-container" style="display: none;">
            <h2>Chat</h2>
            <div id="chat">Converse aqui...</div>
        </div>
        <div id="preview-container" style="display: none;">
            <h2>Pré-visualização</h2>
            <div id="preview">Visualização aqui...</div>
        </div>
        <div id="playground-container" style="display: none;">
            <h2>Playground</h2>
            <div id="playground">Área de teste aqui...</div>
        </div>
    </div>

    <script>
        // Funções de autenticação
        async function registerUser() {
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;
            const { user, error } = await supabase.auth.signUp({ email, password });
            if (error) {
                alert(error.message);
            } else {
                alert('Usuário registrado com sucesso!');
            }
        }

        async function loginUser() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const { user, error } = await supabase.auth.signIn({ email, password });
            if (error) {
                alert(error.message);
            } else {
                alert('Login bem-sucedido!');
                showEditor(); // Exibir editor após login
            }
        }

        function showLogin() {
            document.getElementById('login-container').style.display = 'block';
            document.getElementById('register-container').style.display = 'none';
        }

        function showRegister() {
            document.getElementById('login-container').style.display = 'none';
            document.getElementById('register-container').style.display = 'block';
        }

        // Registro do Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').then((registration) => {
                    console.log('Service Worker registrado com sucesso:', registration);
                }).catch((error) => {
                    console.error('Falha ao registrar o Service Worker:', error);
                });
            });
        }
    </script>
</body>
</html>
